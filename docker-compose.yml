version: '3.8'

services:
  eucast-mic-breakpoint-interpreter:
    build: .
    container_name: eucast-mic-breakpoint-interpreter
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=eucast-mic-breakpoint-interpreter-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
