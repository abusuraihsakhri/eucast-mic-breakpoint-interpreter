name: Tests and safety checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile and run unit tests
        run: |
          python -m compileall -q eucast_interpreter.py cli.py agents
          python -m pytest -q
      - name: Browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text()
          assert "<script>" in html and "</script>" in html
          Path("/tmp/mic-web.js").write_text(html.split("<script>", 1)[1].split("</script>", 1)[0])
          PY
          node --check /tmp/mic-web.js
